# Fixture config that routes EVERY logical model to OpenCode and nothing else.
# Used by scripts/opencode-routing-check.sh to assert that the gateway really
# routes to OpenCode end to end (chain selection, attribution headers, sticky
# sessions, streaming) instead of silently serving some other provider.
#
# Why this is a separate file and not a fifth profile in config.yaml:
# `LogicalModels` in config.go is the hardcoded list ["smart","work","fast",
# "large"] and `IsValidModel` gates every /v1/chat/completions request against
# it, so a "test" key under models: parses fine and is permanently unroutable
# (400 "Unknown model"). scripts/check-rules.py rule 5, scripts/validate-config.py
# and TestRealConfigChainInvariants all reject the extra key as well, and
# regenerate_config.py rewrites the models section from scratch on every sync,
# which would delete it. Same reasoning as testdata/ci-config.yaml.
#
# Deliberately NOT a valid production config: single-endpoint chains that never
# reach kilo-auto/free, so scripts/validate-config.py rejects it. It is a test
# fixture, not a deployment target.
#
# Only big-pickle is listed, and that is a deliberate choice, not the
# limit of what this key can serve.
#
# It answers HTTP 200 regardless of request shape, so it isolates what this
# fixture is FOR: chain selection, the synthesized attribution headers, sticky
# session pinning and streaming. Adding a gate-dependent model here would make a
# 403 mean "the check forgot the free-tier gate" instead of "routing broke".
#
# space-bunny-free used to be here; upstream deprecated it (410 ModelDeprecated,
# recommending minimax-m3.1-flash-free) on 2026-10-21, and that model answers
# HTTP 402 "insufficient account funds" on this account, so it could never
# serve this check again. big-pickle answers 200 and is the gate-independent
# probe model named in the OPENCODE gate notes of fetch-free-models.py; the key
# also reaches mimo-v2.6-flash-free, longcat-2.5-preview-free and
# nemotron-3-ultra-free, but those drift with upstream's catalogue and are not
# pinned here.
#
# Never back-fill a deprecated model to keep this stage green: upstream refused
# space-bunny-free, so any routing attempt hits the documented cooldown path
# instead of proving routing.
providers:
  opencode:
    url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY

models:
  smart:
    chain:
      - provider: opencode
        model: big-pickle
        vision: false
        intelligence: 25.0
  work:
    chain:
      - provider: opencode
        model: big-pickle
        vision: false
        intelligence: 25.0
  fast:
    chain:
      - provider: opencode
        model: big-pickle
        vision: false
        intelligence: 25.0
  large:
    chain:
      - provider: opencode
        model: big-pickle
        vision: false
        intelligence: 25.0