name: ci

on:
  push:
  pull_request:

# A job that never runs is indistinguishable from a job that passes. These
# make the failure modes loud instead of silent:
#
#   continue-on-error: false (set per job) — a red X here is a real failure,
#     never a "known flake". Without it, a maintainer can neuter a guard by
#     adding one line, and the guard still looks present in the file. GitHub's
#     `defaults` block only accepts `run` (shell/working-directory), so this has
#     to be set on each job rather than once at the top.
#
# The step-level `continue-on-error` on the SSE negative check is the one
# deliberate exception, and it is annotated at the step: exit 2 there means
# "this guard needs re-targeting after a refactor", not "the contract broke".
defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      # One broken job must not cancel the others: the SSE contract job and the
      # go job fail for unrelated reasons, and cancelling one hides the other.
      fail-fast: false
    steps:
      # fetch-depth: 0 is required, not an optimisation. The attribution check
      # below compares dist/README.md's unpushed-commit list against
      # origin/master..HEAD; a shallow single-ref checkout has no origin/master,
      # so the check would skip that half and still exit 0 — a guard that passes
      # because it could not see the thing it guards is worse than no guard.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # gofmt drift is semantically a no-op but hides real diffs, so it is
      # gated rather than left to rot. Fix with: gofmt -w *.go
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            echo "run: gofmt -w ."
            exit 1
          fi

      - name: test
        run: go test -race ./...

      # Replays every Fuzz target's seed corpus, then fuzzes each for 20s.
      #
      # This used to be three steps naming one target by hand. That is coverage
      # for that target and silence for every other: a second fuzzer looks
      # covered (its seeds run incidentally under `go test ./...`) while nothing
      # actually explores it, and a renamed target leaves a step pointing at
      # nothing. Both failures are invisible — the command still exits 0.
      #
      # scripts/fuzz-gate.sh derives the target list from the source on every
      # run, so a new fuzzer is picked up without editing CI, and it exits
      # non-zero when discovery finds nothing rather than covering nothing
      # quietly. It also does what the removed step did: Go writes a crasher to
      # testdata/fuzz automatically, and the gate fails if one is sitting in the
      # working tree uncommitted, because a crasher nobody commits is a
      # regression nobody can reproduce.
      #
      # The golden fixtures under testdata/metrics are the durable half of this
      # story: they pin the specific historical output that survived three audit
      # rounds, which no fuzzer is likely to rediscover. This step is the
      # exploratory half, and is bounded so it cannot slow a commit down.
      #
      # FROZEN=1 would replay seeds without fuzzing; not used here, because a
      # gate that has quietly stopped exploring looks exactly like a passing one.
      #
      # The duration is an argument, not an env var, and the script rejects a
      # non-integer one as a usage error. It used to pass the value straight to
      # -fuzztime, where "FROZEN=1" became a silently-invalid duration that Go
      # reported as "invalid duration" — indistinguishable from a fuzz failure.
      - name: fuzz gate (all targets, 20s each)
        run: bash scripts/fuzz-gate.sh 20

      # The fuzz gate above cannot be validated by running it: every defect
      # round 9 found in it is dormant in a single-package repository, which is
      # what this one is, so "the gate passes" and "the gate covers two
      # packages" are indistinguishable from inside CI. This builds throwaway
      # two-package repositories and asserts the gate's behaviour there, so the
      # condition that hid those defects is reproduced on every run.
      #
      # Runs first in this job's ordering in the sense that it is cheap and
      # needs no Go toolchain of its own — it stubs `go` — but it is placed
      # immediately after the gate so a reader sees the two together. It exits
      # non-zero on any case that misbehaves, and its last case runs the
      # pre-round-9 gate against the same fixtures to prove the suite can fail.
      - name: fuzz gate self-test
        run: bash scripts/fuzz-gate-selftest.sh

      # Proves the SSE ordering guard has teeth: it reintroduces the historical
      # bug, requires the ordering tests to FAIL, then restores proxy.go and
      # requires them to pass again. A test that passes both ways guards nothing,
      # and this is the only automated way to tell the difference. Skipped if
      # streamSSE is refactored past the mutation site (exit 2), so a legitimate
      # refactor does not silently turn this into a no-op.
      - name: negative-check the SSE ordering guard
        run: |
          set +e
          bash scripts/sse-negative-check.sh
          code=$?
          set -e
          # exit 2 = the mutation site moved because streamSSE was refactored.
          # That is a signal to update the script, not a failure of the guard.
          if [ "$code" -eq 2 ]; then
            echo "::warning::streamSSE was refactored; the negative check needs updating"
          elif [ "$code" -ne 0 ]; then
            echo "::error::the SSE ordering guard is toothless — see above"
            exit 1
          fi

      # A GitHub PAT was found sitting in plaintext in the origin remote URL.
      # It had not been committed, but it was on disk, in `git remote -v`, and
      # in the process table of every push. This scans tracked content, recent
      # history, and .git/config so the next one is caught at PR time instead of
      # by accident.
      - name: secret scan
        run: bash scripts/secret-scan.sh

      # docs/audit.md cites the *symbol* each finding concerns rather than a
      # line number, so the citations survive edits above them. That only stays
      # true if something checks it: an anchor that names a deleted function is
      # worse than a stale line number, because it sends the reader looking for
      # code that no longer exists. Cheap to run, and it fails loudly instead of
      # rotting. Needs only the stdlib, so the runner's preinstalled python3 is
      # enough (no setup-python step, no dependencies).
      - name: audit anchors resolve
        run: python3 scripts/audit-drift-check.py

      # audit-drift-check.py was the one script in the repository with no
      # self-test, and it was the one that carried a real bug: it read sources
      # with a root-only glob, so a symbol that had merely moved into a
      # subdirectory was reported as deleted, with a remediation (add it to the
      # ALLOWLIST) that is both wrong and permanent. That bug is invisible in a
      # single-package repository — which this one is — so running the checker
      # proves nothing about whether it can see a second package.
      #
      # This builds throwaway two-package repositories and asserts the checker
      # walks into them, that a stale anchor is caught, and that a checker
      # reverted to the root-only glob fails the same suite. Negative controls
      # run against COPIES, never the real script, so the suite cannot damage
      # the thing it is testing.
      - name: audit drift self-test
        run: bash scripts/audit-drift-selftest.sh

      # The anchor check above validates that the SYMBOL a finding names still
      # exists. It says nothing about whether the FIX a finding describes was
      # applied, and those are different questions. That gap had a concrete
      # cost: a round documented a change to this very script, verified it, then
      # a `git reset --hard` during unrelated probing destroyed it — and every
      # check kept passing, because the anchors were all still valid. The
      # finding was right about the code and wrong about the commit.
      #
      # This checks the other direction: every commit hash the documentation
      # cites resolves to a real commit, and dist/README.md's unpushed-commit
      # list matches git as a set (not a count — a count is satisfied by any
      # equally wrong list, which is how the fuzz gate's own bug survived three
      # rounds). Needs the full history fetched above; without it this step
      # degrades to the citation check and says so.
      - name: audit attributions resolve
        run: python3 scripts/audit-attribution-check.py

      # The attribution check is the guard that catches a claim about a commit
      # being written from memory rather than from the history -- the exact shape
      # a lost fix takes. It also carries the only piece of logic here that is
      # easy to get subtly wrong while still looking correct: the self-reference
      # exemption. dist/README.md lists the unpushed commits, but writing the list
      # creates a commit that makes the list wrong. The first exemption was "the
      # diff touches dist/README.md", which is gameable -- attach a one-line README
      # tweak to a real code commit and the whole commit escapes the list.
      #
      # This is the same technique as the other two self-tests: throwaway
      # repositories, negative controls against COPIES, and a liveness case. It
      # additionally replays the unpushed patch with `git am` to produce a
      # genuinely re-hashed history, so the --recovered path is exercised against
      # a real recovery rather than asserted about.
      - name: audit attribution self-test
        run: bash scripts/audit-attribution-selftest.sh

      # dist-freshness-check.sh itself is NOT run in this job, and deliberately
      # so. It verifies the local bundle and patch against the local HEAD, and
      # those artifacts are generated and gitignored -- a CI checkout has none,
      # so the check would correctly report them missing and the job would be
      # permanently red. There is nothing for CI to verify about another
      # machine's unpushed history. What CI can and does gate is the LOGIC, via
      # this self-test, which builds throwaway repositories with deliberately
      # fresh, stale, missing and corrupt artifacts and asserts each is
      # classified correctly.
      - name: dist freshness self-test
        run: bash scripts/dist-freshness-selftest.sh

      # recovery-check.sh is the LOCAL gate: it proves the generated bundle and
      # patch really recover the tree, on the machine that generated them. CI
      # cannot run it, for the same reason dist-freshness-check.sh cannot: the
      # artifacts are generated and gitignored, and a CI checkout has none and
      # no unpushed commits to recover. What CI gates is the LOGIC, and this
      # self-test builds throwaway fixtures with healthy, stale, corrupt,
      # inapplicable, missing and over-specified artifacts, then asserts each is
      # classified correctly -- including two negative controls that neuter the
      # check and require the neutered copy to change its verdict.
      - name: recovery check self-test
        run: bash scripts/recovery-check-selftest.sh

      # `while`/`until` take `do`, never `then`. That is plain POSIX, but bash
      # reports the error at the `done` several lines after the real mistake,
      # which makes it expensive to find. The control suite is run alongside the
      # linter on purpose: a linter that has never been seen to reject anything
      # is not known to work, and one that rejects valid code is worse than
      # none. The controls assert that flagged code genuinely fails `bash -n`
      # and that unflagged code genuinely parses.
      - name: shell lint
        run: bash scripts/shell-lint.sh

      - name: shell lint self-test
        run: bash scripts/shell-lint-control.sh

  config:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install pyyaml pytest

      # validate-config.py is the guard that stops the nightly model sync from
      # writing a config with unroutable profiles, dead providers, or a missing
      # api_key_env (the cause of the silent 401 incident).
      - name: validate config
        run: python3 scripts/validate-config.py config.yaml

      # Regression tests for the config generator, which once destroyed the
      # whole providers: section on every run via an unanchored regex.
      - name: test config generator
        run: python3 -m pytest scripts/test_regenerate_config.py -q

      - name: compile python scripts
        run:           python3 -m py_compile fetch-free-models.py regenerate_config.py model_utils.py scripts/validate-config.py scripts/sse-check.py scripts/fake-sse-upstream.py scripts/audit-drift-check.py scripts/audit-attribution-check.py

  # End-to-end assertion of the SSE termination contract. The bug this guards
  # (a `data: [DONE]` released ahead of the real chunks, so the client silently
  # drops the answer) returned HTTP 200 and was invisible to every check in the
  # go job — it only shows up when you assert on the captured bytes. That is
  # what scripts/sse-check.py does, so it needs a real gateway in front of a
  # real SSE stream.
  #
  # The upstream is scripts/fake-sse-upstream.py, not a live provider: CI has no
  # provider credentials, and the contract is decided by the gateway's framing,
  # not by which model answered. The fake is deliberately nastier than a real
  # provider (comment lines interleaved mid-chunk, no trailing blank line on the
  # final event) so the test actually exercises the failure modes.
  # NOTE: this job must be listed as a required status check in the repository's
  # branch protection rules, or a red X here is advisory only. That setting is
  # an org-level config and cannot be set from this file — see docs/RUNBOOK.md
  # ("Required status checks") for the exact values to enter. Everything that CAN
  # be enforced from here is: a nonzero exit fails the job, and the job is not
  # allowed to be marked continue-on-error.
  sse-contract:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Everything below runs as long-lived background servers. They are
      # started with setsid + a PID file and torn down in `stop servers`, which
      # is `if: always()` so a failed assertion still releases the ports for
      # the job's own cleanup and the log step can still read the log file.
      #
      # The config is a committed fixture (testdata/ci-config.yaml), not a
      # heredoc: a config that only exists inside a `run:` block is invisible to
      # review, to the `config` job, and to anyone debugging a failure.
      - name: start fake upstream
        run: |
          setsid python3 scripts/fake-sse-upstream.py --port 9099 \
            > /tmp/fake-upstream.log 2>&1 < /dev/null &
          echo $! > /tmp/fake-upstream.pid
          # Bounded readiness wait. The fake answers 200 to any POST, so a
          # successful probe means the socket is accepting, not just bound.
          for i in $(seq 1 50); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:9099/v1/chat/completions; then
              echo "fake upstream ready after ${i} probe(s)"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::fake upstream did not become ready"
          cat /tmp/fake-upstream.log
          exit 1

      - name: start gateway
        run: |
          go build -o /tmp/airouter .
          # FAKE_KEY is what the fixture's api_key_env names. It is set so the
          # upstream request carries an Authorization header, matching a real
          # deployment — Config.validate does not require it and the fake
          # upstream ignores it, so this is realism, not a dependency.
          setsid env FAKE_KEY=ci-fake-key /tmp/airouter \
            -config testdata/ci-config.yaml -port 9090 \
            -api-key ci-test-key > /tmp/airouter.log 2>&1 < /dev/null &
          echo $! > /tmp/airouter.pid
          for i in $(seq 1 100); do
            if curl -sf -o /dev/null http://127.0.0.1:9090/health; then
              echo "gateway ready after ${i} probe(s)"
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::gateway did not become ready"
          cat /tmp/airouter.log
          exit 1

      - name: assert termination contract
        run: |
          AIROUTER_API_KEY=ci-test-key python3 scripts/sse-check.py \
            --url http://127.0.0.1:9090/v1/chat/completions \
            --expect "PING OK" --rounds 3

      - name: assert SSE comments never reach the client
        run: |
          # The gateway must strip upstream comment lines. Checking it here as
          # well as in sse-check.py keeps the failure legible in CI logs even if
          # the contract script itself changes.
          body=$(AIROUTER_API_KEY=ci-test-key curl -sf -N \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-test-key' \
            -d '{"model":"work","stream":true,"messages":[{"role":"user","content":"ping"}]}' \
            http://127.0.0.1:9090/v1/chat/completions)
          if printf '%s' "$body" | grep -q '^:'; then
            echo "::error::an SSE comment line leaked to the client"
            printf '%s\n' "$body" | head -20
            exit 1
          fi
          sentinels=$(printf '%s' "$body" | grep -c '^data: \[DONE\]$' || true)
          if [ "$sentinels" -ne 1 ]; then
            echo "::error::expected exactly 1 [DONE] sentinel, got $sentinels"
            printf '%s\n' "$body" | head -20
            exit 1
          fi

      - name: metrics expose attempt telemetry
        run: |
          # /metrics is authenticated: the series are labelled by provider and
          # model, so an unauthenticated scrape is an information leak. Assert
          # the rejection too, so a future refactor can't quietly unprotect it.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/metrics)
          if [ "$code" = "200" ]; then
            echo "::error::/metrics served without credentials"
            exit 1
          fi
          # Drive one request first: the attempt series only exist once the
          # router has actually made an attempt, so scraping a freshly booted
          # gateway would otherwise assert against an empty registry.
          curl -sf -o /dev/null -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-test-key' \
            -d '{"model":"work","stream":false,"messages":[{"role":"user","content":"ping"}]}' \
            http://127.0.0.1:9090/v1/chat/completions || true
          curl -sf -H 'Authorization: Bearer ci-test-key' \
            -o /tmp/metrics.txt http://127.0.0.1:9090/metrics || {
            echo "::error::/metrics rejected valid credentials"; exit 1;
          }
          for series in \
            airouter_endpoint_attempts_total \
            airouter_endpoint_attempt_failures_total \
            airouter_endpoint_attempt_duration_seconds; do
            if ! grep -q "^$series" /tmp/metrics.txt; then
              echo "::error::missing metric series: $series"
              exit 1
            fi
          done

          # The attempt series must be present AND non-zero. A series that
          # exists but never increments is the exact failure mode that let
          # /metrics stay unmounted for so long: the code looked right, the
          # dashboard looked fine, and nothing was actually being recorded.
          attempts=$(grep '^airouter_endpoint_attempts_total{' /tmp/metrics.txt \
            | awk '{s += $NF} END {print s + 0}')
          if [ "$attempts" -lt 1 ]; then
            echo "::error::no upstream attempts recorded; attempt telemetry is dead"
            exit 1
          fi

      - name: assert SSE comment counter is wired and non-zero
        run: |
          # The fake upstream interleaves ": keepalive" lines on every request,
          # and the contract step above already made 12 of them. If the counter
          # is missing OR zero, the comment-stripping path is no longer
          # instrumented — a silent regression, since stripping still works and
          # every other assertion would pass.
          curl -sf -H 'Authorization: Bearer ci-test-key' \
            -o /tmp/metrics2.txt http://127.0.0.1:9090/metrics || {
            echo "::error::/metrics unreachable"; exit 1;
          }
          if ! grep -q '^airouter_sse_comments_routed_out' /tmp/metrics2.txt; then
            echo "::error::airouter_sse_comments_routed_out is not exported"
            exit 1
          fi
          comments=$(awk '/^airouter_sse_comments_routed_out /{print $2; exit}' /tmp/metrics2.txt)
          if [ "${comments:-0}" -lt 1 ]; then
            echo "::error::sse comment counter is ${comments:-<missing>}, expected > 0"
            echo "the upstream emitted keepalives on every request, so a zero here means the counter is not wired"
            exit 1
          fi
          echo "sse comments routed out: $comments"

      - name: metrics output parses and labels are not forged
        run: |
          # The registry is bounded and label values are escaped, but both
          # properties are only worth anything if the served output is still
          # valid exposition format. A scrape that fails to parse takes the
          # dashboard down silently, and an unescaped label can forge a series
          # that an operator reads as real. Python's own parser is the check:
          # no dependency, and it is the same shape a real scraper sees.
          AIROUTER_API_KEY=ci-test-key python3 - <<'PY'
          import os, re, sys, urllib.request

          req = urllib.request.Request(
              "http://127.0.0.1:9090/metrics",
              headers={"Authorization": "Bearer " + os.environ["AIROUTER_API_KEY"]})
          body = urllib.request.urlopen(req, timeout=10).read().decode()

          series = 0
          for lineno, line in enumerate(body.splitlines(), 1):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              series += 1
              # name{labels} value  — the value must be a bare number, which
              # is exactly what an unescaped newline in a label would break.
              m = re.fullmatch(r"([a-zA-Z_:][a-zA-Z0-9_:]*)(\{.*\})? ([^ ]+)", line)
              if not m:
                  print(f"::error::line {lineno} does not parse as a series: {line!r}")
                  sys.exit(1)
              float(m.group(3))  # raises if the value is not numeric
              # No raw control characters may reach the wire.
              if any(ord(c) < 0x20 for c in line):
                  print(f"::error::line {lineno} contains a raw control character: {line!r}")
                  sys.exit(1)
              if m.group(2):
                  # Every label value must be quoted; an unquoted one means the
                  # escaping was bypassed somewhere.
                  for pair in re.findall(r'([a-zA-Z_][a-zA-Z0-9_]*)=((?:"(?:[^"\\]|\\.)*")|[^,]*)', m.group(2)):
                      if not pair[1].startswith('"'):
                          print(f"::error::line {lineno} has an unquoted label value: {line!r}")
                          sys.exit(1)
          if series == 0:
              print("::error::/metrics returned no series at all")
              sys.exit(1)
          print(f"metrics exposition parsed cleanly: {series} series")
          PY

      - name: no series uses the overflow bucket as a label set
        run: |
          # The regex above is deliberately lenient about label sets -- it
          # accepts any {...} -- so it would happily pass a line like
          #   airouter_circuit_state_transitions{__overflow__} 4
          # which is NOT a legal sample: a bare word sitting where a label set
          # belongs. Prometheus rejects the whole scrape on that, taking every
          # dashboard and alert on the instance with it. Only reachable once the
          # label cap is hit, which is why it needs its own check rather than
          # living in the parse step above.
          curl -sf -H 'Authorization: Bearer ci-test-key' \
            -o /tmp/metrics3.txt http://127.0.0.1:9090/metrics || {
            echo "::error::/metrics unreachable"; exit 1;
          }
          # Only lines that actually carry a label set. A series with no
          # labels at all (the _sum/_count companions, the unlabelled
          # counters) has no "{" and is perfectly legal -- matching on those
          # too would fail the check for the wrong reason and teach the next
          # reader to ignore it.
          bad=$(grep -E '^[a-zA-Z_][a-zA-Z0-9_:]*\{' /tmp/metrics3.txt \
            | grep -vE '\{[a-zA-Z_][a-zA-Z0-9_]*="' || true)
          if [ -n "$bad" ]; then
            echo "::error::malformed label set in /metrics:"
            echo "$bad" | head -5
            exit 1
          fi
          # And the new eviction counter must actually be exported, so a
          # regression that un-wires it is visible here rather than in a
          # dashboard that silently stops rendering a series.
          if ! grep -q '^airouter_metrics_label_evictions_total' /tmp/metrics3.txt; then
            echo "::error::airouter_metrics_label_evictions_total is not exported"
            exit 1
          fi
          # If a bucket is present it must sit under the label name its series
          # already uses. A bucket under a *different* name changes the metric's
          # label schema, which Prometheus reads as a new series: a query
          # grouping by status silently loses it. Assert the real status bucket
          # name rather than a single global one, so a regression that reverts to
          # endpoint=__overflow__ everywhere is caught.
          if grep -q '__overflow__' /tmp/metrics3.txt; then
            # Check the pairing, not just the presence of the name: the bucket
            # must appear as name="__overflow__" where name is the label that
            # series actually uses. Matching on __overflow__ alone would pass a
            # bucket under the wrong label, which is the bug -- so grep for
            # __overflow__ as a VALUE, and require the label name to be one of
            # the three the gateway actually uses.
            wrong=$(grep '__overflow__' /tmp/metrics3.txt \
              | grep -vE '\{[a-zA-Z_][a-zA-Z0-9_]*="__overflow__"')
            if [ -n "$wrong" ]; then
              echo "::error::__overflow__ bucket not carried by a proper label value:"
              echo "$wrong" | head -3
              exit 1
            fi
            # requests_total carries BOTH a model and a status dimension, so a
            # model bucket and a status bucket are both correct; what is not
            # correct is an endpoint bucket on those two series, since neither
            # has an endpoint label at all.
            for metric in airouter_requests_total airouter_failures_total; do
              if grep "^$metric{" /tmp/metrics3.txt | grep -q 'endpoint="__overflow__"'; then
                echo "::error::$metric has an endpoint=\"__overflow__\" bucket but no endpoint label"
                exit 1
              fi
            done
            # The overflow label must never appear in a histogram. It cannot:
            # evicted labels roll their count and sum into the bucket, but their
            # per-band data is unrepresentable, so the bucket would have to
            # report a distribution it does not have. The output that did so
            # parsed, declared histogram, and claimed that a set of 10ms
            # observations were all above 45s -- silently wrong, and
            # histogram_quantile returns a plausible-looking nonsense number
            # rather than an error. Assert the absence so the shape cannot come
            # back, at any bucket bound.
            if grep -E '^airouter_endpoint_attempt_duration_seconds(_bucket|_sum|_count)?\{' /tmp/metrics3.txt \
              | grep -q 'endpoint="__overflow__"'; then
              echo "::error::overflow label is exposed as a histogram; its per-band distribution"
              echo "::error::is unknowable and histogram_quantile over it returns nonsense"
              grep -E '^airouter_endpoint_attempt_duration_seconds' /tmp/metrics3.txt \
                | grep 'endpoint="__overflow__"' | head -5
              exit 1
            fi
            # ...and the replacement gauges must exist, or the observations are
            # simply gone: unreported rather than honestly reported.
            for g in airouter_evicted_attempts_latency_seconds_sum \
                     airouter_evicted_attempts_latency_seconds_count; do
              if ! grep -q "^# TYPE $g gauge" /tmp/metrics3.txt; then
                echo "::error::$g is not exported as a gauge"
                exit 1
              fi
            done
            echo "overflow buckets use per-series label names and are not histograms"
          else
            echo "no overflow buckets yet (expected below the cap)"
          fi
          echo "label set shape and eviction counter OK"

      - name: stop servers
        if: always()
        run: |
          for f in /tmp/airouter.pid /tmp/fake-upstream.pid; do
            [ -f "$f" ] || continue
            kill "$(cat "$f")" 2>/dev/null || true
          done

      - name: gateway log
        if: always()
        run: |
          echo "--- fake upstream ---"; cat /tmp/fake-upstream.log 2>/dev/null || true
          echo "--- gateway ---"; cat /tmp/airouter.log 2>/dev/null || true

  # export-unpushed.sh is how the unpushed set is handed off, and it is the only
  # thing standing between "16 commits ahead of origin" and those commits being
  # silently lost. It is also a script with three distinct outcomes -- a real
  # export, a no-op when there is nothing unpushed, and a hard error when the
  # upstream ref does not exist -- and only the first is exercised by running it
  # by hand. The two failure paths are the ones that matter: a no-op that
  # reports success while writing an empty bundle, or an upstream typo that
  # produces a patch of the wrong commits, both look fine from the terminal.
  unpushed-export:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up a base ref to diff against
        run: |
          # The script diffs $UPSTREAM..HEAD, so the test needs an upstream that
          # is known to be behind HEAD. A dedicated ref at HEAD does that without
          # moving the checked-out branch -- which actions/checkout may have
          # checked out as a worktree branch (and which then cannot be
          # force-updated) or left detached (and which has no branch to update).
          # Using origin/master instead would make this job's result depend on
          # whether the event is a push or a pull_request, since a PR's HEAD is
          # a merge commit that is two ahead of master.
          git config user.name ci
          git config user.email ci@example.invalid
          git branch -f base HEAD
          echo "base is $(git rev-parse --short base)"

      - name: no-op path writes nothing
        run: |
          set -euo pipefail
          # Clear any generated artifacts first. They are build output, ignored
          # by git, and safe to delete. The alternative -- asserting the files
          # are absent after the run -- is a false failure the moment anyone
          # runs the script locally before pushing, because a leftover bundle
          # from that run is indistinguishable from one this run wrote. The
          # property under test is "this run created nothing", not "no bundle
          # has ever existed".
          rm -f dist/airouter-unpushed.bundle dist/airouter-unpushed.patch
          out=$(UPSTREAM=base ./scripts/export-unpushed.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q 'nothing unpushed' || {
            echo "::error::expected a no-op message when nothing is unpushed"; exit 1;
          }
          # A no-op that still wrote a bundle is worse than a no-op that failed:
          # it leaves an empty artifact that looks recoverable.
          if [ -e dist/airouter-unpushed.bundle ] || [ -e dist/airouter-unpushed.patch ]; then
            echo "::error::a no-op run wrote artifacts"
            exit 1
          fi

      - name: unknown upstream fails loudly
        run: |
          set -euo pipefail
          # Non-zero exit, and a message naming the ref. A script that silently
          # fell back to a different upstream would export the wrong commits.
          if out=$(UPSTREAM=base/nope ./scripts/export-unpushed.sh 2>&1); then
            echo "::error::expected a non-zero exit for a missing upstream"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'base/nope' || {
            echo "::error::the error message does not name the bad upstream"; exit 1
          }

      - name: real export is complete and correct
        run: |
          set -euo pipefail
          # Real content, not --allow-empty. An empty commit produces a patch
          # with no diff at all, and `git am` refuses one ("Patch is empty")
          # unless --allow-empty is passed. That made this job's fixture
          # unreplayable, which the recovery step below caught on its first run.
          # A handoff fixture must be one a reader can actually apply.
          echo unpushed-one > change-one.txt
          git add change-one.txt
          git commit -q -m "unpushed one"
          echo unpushed-two > change-two.txt
          git add change-two.txt
          git commit -q -m "unpushed two"
          out=$(UPSTREAM=base ./scripts/export-unpushed.sh 2>&1)
          echo "$out"
          echo "$out" | grep -q 'exported 2 commits' || {
            echo "::error::expected exactly 2 exported commits"; exit 1
          }
          # Both artifacts exist and are non-empty. An empty patch is what a
          # wrong upstream produces.
          test -s dist/airouter-unpushed.patch || {
            echo "::error::patch is missing or empty"; exit 1
          }
          test -s dist/airouter-unpushed.bundle || {
            echo "::error::bundle is missing or empty"; exit 1
          }
          # The bundle must be clonable and must actually carry the unpushed
          # commits. `git bundle verify` only checks the index; running the
          # script's own printed recovery instructions is the only thing that
          # proves the hand-off works. It did not: git bundle create A..HEAD
          # records the tip as the ref "HEAD", and git fetch rejects
          # "refs/heads/HEAD" outright, so the documented recovery command
          # failed on a bundle that verified and was non-empty.
          git bundle verify dist/airouter-unpushed.bundle
          rm -rf /tmp/check
          # Clone at the base, not at HEAD, so the recovered commits are
          # genuinely absent before the fetch and the count means something.
          git clone -q -b base . /tmp/check
          git -C /tmp/check fetch -q "$GITHUB_WORKSPACE/dist/airouter-unpushed.bundle" \
            'refs/heads/airouter-unpushed-export:refs/heads/recovered'
          git -C /tmp/check log --oneline recovered
          test "$(git -C /tmp/check rev-list --count base..recovered)" = 2 || {
            echo "::error::the bundle did not carry both unpushed commits"; exit 1
          }
          # The temporary ref exists only to name the bundle tip; it must not
          # outlive the run.
          if git rev-parse --verify --quiet refs/heads/airouter-unpushed-export >/dev/null; then
            echo "::error::the temporary export ref leaked into the repository"
            exit 1
          fi
          # The artifacts are generated, not committed. A regression that
          # re-adds them to the index reintroduces the self-referential loop
          # the script exists to avoid.
          if git ls-files --error-unmatch dist/airouter-unpushed.bundle >/dev/null 2>&1; then
            echo "::error::the bundle is tracked; it must stay a build artifact"; exit 1
          fi
          # And the artifacts that were just written must actually describe the
          # repository they were written from. This job generates them, so it
          # is the one place where "fresh" is a real assertion rather than a
          # hope: everything above checks that the export RAN and that the
          # bundle carries the right commits, and this checks that the bundle's
          # tip and the patch's tail are actually HEAD. A generator that
          # silently wrote yesterday's state would satisfy every other
          # assertion in this job.
          # UPSTREAM must match what the export above was run against; the
          # default (origin/master) is not what this job generated from.
          UPSTREAM=base bash scripts/dist-freshness-check.sh --verbose

      # Everything above proves the artifacts were PRODUCED correctly. This
      # proves they are USABLE, which is a different claim and the one a
      # handoff actually depends on: a bundle that verifies and is non-empty
      # can still be unfetchable, and a patch can apply cleanly and produce a
      # tree that does not build.
      #
      # This is the first place recovery-check.sh runs outside a developer's
      # machine. It could not before: it needs generated artifacts, and the `go`
      # job has none. This job has them, and has a real `base` ref to replay
      # onto, so the whole 15-assertion path is covered automatically.
      #
      # --quick skips the build and test suite inside the recovered tree. That
      # is deliberate: the recovered tree is byte-identical to the checked-out
      # one (asserted before that point), so the `go` job has already built and
      # tested that exact content. What is NOT covered elsewhere is whether the
      # artifacts reproduce it at all.
      - name: artifacts actually recover
        run: UPSTREAM=base bash scripts/recovery-check.sh --quick

      # And the freshness check is run AGAIN, after recovery-check.sh ran, to
      # prove the recovery process did not mutate the artifacts it was reading.
      # A check that leaves its subject modified is worse than one that does
      # nothing: the next person trusts a file that a tool rewrote.
      - name: recovery did not disturb the artifacts
        run: UPSTREAM=base bash scripts/dist-freshness-check.sh

      # The handoff document is the one artifact a human is guaranteed to follow
      # and the only one nothing else here reads. It once told the reader to run
      # `git fetch ... 'HEAD:refs/heads/frombundle'`, which git rejects outright
      # -- the exact defect recovery-check.sh exists to catch in code, left
      # sitting in the instructions. This executes the document's own commands
      # against a freshly generated bundle rather than grepping for them.
      - name: the handoff document's commands actually work
        run: bash scripts/doc-verify.sh

      # doc-verify.sh's verdict was, for a while, produced by running it once and
      # seeing green -- which is evidence that proves nothing. This breaks the
      # document in the ways it has actually broken and requires the check to go
      # red for a NAMED reason, so the check above cannot pass vacuously.
      - name: the document check can actually fail
        run: bash scripts/doc-verify-selftest.sh
