# Airouter AI Gateway Configuration
#
# Providers: OpenAI-compatible backend endpoints
# Each provider has:
#   url: The base URL for the OpenAI-compatible API
#   api_key_env: Environment variable name containing the API key
#   headers: Optional map of extra HTTP headers to send to this provider
#            (e.g. {"HTTP-Referer": "...", "X-Title": "..."}).
#
# Models: Logical model names (smart, work, fast, large) mapped to fallback chains
# Each chain is a list of endpoints, each specifying:
#   provider: Provider name (key in providers)
#   model: Actual model name on that provider
#
# Distribution rules (see AGENTS.md and scripts/sync-instruction.txt, which
# scripts/check-rules.py enforces against the fetched model list):
#   - Each chain is ordered best-first by model quality (intelligence benchmark),
#     descending; the strongest model for the profile sits at the top. `large`
#     is the exception: it sorts by context window descending, then intelligence.
#   - Profile membership, so a model lands where it is meant to be used:
#       smart  intelligence >= 25, any context window
#       work   the smart pool extended down to intelligence >= 15
#       fast   intelligence < 25 or an id containing flash-lite / lightning /
#              nano / gemma / lfm / laguna-xs, capped at 10 distinct models
#       large  context_length >= 200000 only
#   - Every NVIDIA NIM model is emitted as a consecutive nvidia / nvidia2 / nvidia3
#     trio (same model id, three API keys) so a 429 on one key falls through to the
#     next key on the same model instead of failing the request.
#   - The LAST entry of every chain is that profile's "auto" fallback.
#
# Copy this file to config.yaml and fill in your API keys and model choices before
# starting the gateway. The nightly model sync (scripts/sync-models.sh) regenerates
# the `models:` section from the live free-model list; `providers:` and
# `preferences:` are yours to edit and are preserved across syncs.

providers:
  # To rotate API keys, add a numbered entry with the same url and its own
  # *_API_KEY_N env var (nvidia2, gemini2, commandcode2, ...). A rate limit on
  # one key then falls through to the next key on the same model instead of
  # failing the request. One entry per provider is kept here so the example
  # stays short -- add more as you need them.
  #
  # Optional keys, on top of url / api_key_env / headers:
  #
  #   timeout: <duration>   Per-provider request timeout for upstream calls
  #                (e.g. 30s, 60s, 120s). Omitting or setting 0 uses the
  #                built-in default client timeout. Raise this for providers
  #                whose models do long-running work (reasoning, context
  #                compression) so upstream calls are not cut off mid-stream.
  #
  #   max_interruption: <duration>   Maximum time this provider's endpoint may
  #                leave a client without new output during a fallback walk,
  #                including cooldown wait time. 0 or omitted uses the
  #                global 30s ceiling. Cannot exceed 30s.
  #
  #   proxy: <N>   Route this provider's upstream traffic through the proxy pool
  #                (public HTTP CONNECT and SOCKS5 proxies, refreshed every 15
  #                minutes from the built-in source list in proxysources.go).
  #                0 or omitted = direct connection. N > 0 = maximum number of
  #                different proxies to try on an endpoint before falling back
  #                to the next model in the chain.
  #                Set it here, once, and every chain entry that does not carry
  #                its own proxy value inherits it. A proxy dial/CONNECT failure
  #                cools down the proxy (30s) and retries with a different
  #                proxy; an endpoint error (HTTP status, TLS handshake through
  #                an established tunnel) cools down the endpoint as usual.
  #                The proxy service starts automatically when any provider or
  #                endpoint asks for it, so nothing runs when all values are 0.
  #
  # A chain entry may override its provider with its own `proxy: <N>` (same
  # meaning, this endpoint only) -- see the models: section below.

  # Example: NVIDIA NIM
  nvidia:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY        # set this in .envrc

  # Example: Ollama Cloud
  ollama:
    url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY        # set this in .envrc

  # Example: OpenCode gateway
  opencode:
    url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY      # set this in .envrc

  # Example: KiloCode gateway
  kilocode:
    url: https://api.kilo.ai/api/gateway/v1
    api_key_env: KILOCODE_API_KEY      # set this in .envrc

  # Example: Google AI Studio (Gemini)
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY        # set this in .envrc

  # CommandCode (api.commandcode.ai) is not OpenAI-compatible: point the
  # provider straight at the upstream and mark every endpoint that uses it
  # with `protocol: commandcode`. The gateway then speaks /alpha/generate
  # itself, so no separate commandcode-proxy process is needed.
  commandcode:
    url: https://api.commandcode.ai
    api_key_env: COMMANDCODE_API_KEY   # set this in .envrc
  # A second key on the same upstream: a 429 on the first falls through here.
  commandcode2:
    url: https://api.commandcode.ai
    api_key_env: COMMANDCODE_API_KEY_2 # set this in .envrc

preferences:
  newest_first_on_tie: true
  # newest_first_on_tie: when true, the router prefers the newest/champion
  #   model at chain depth 0 for new sessions; when false, sessions are
  #   rotated across the top of the chain by initial_rotation_window.
  #
  # initial_rotation_window: how many endpoints at the head of a chain are
  #   rotated between for the first pick of each new session. 0 disables
  #   rotation (every new session starts at depth 0). Omitting the key uses
  #   the built-in default. Only affects brand-new sessions; once a session
  #   is pinned it stays sticky.
  initial_rotation_window: 8
  #
  # cooldown_jitter: random fraction (0.0 to 0.25) added to transient
  #   cooldowns (429/5xx) so concurrent clients hitting the same
  #   rate-limited provider don't all wake up at once. 0 disables jitter.
  cooldown_jitter: 0.25
  #
  # circuit_breaker_threshold: number of consecutive failures that trips the
  #   circuit breaker for a provider. Explicit 0 disables it entirely.
  #   Omitting the key uses the built-in default.
  circuit_breaker_threshold: 5
  #
  # circuit_half_open_probes: max probes allowed in half-open state before
  #   another request is blocked. Omitting uses the built-in default.
  circuit_half_open_probes: 1
  # default_max_tokens: 0   # uncomment + set to override the auto behavior
  #   Controls the output-token ceiling applied to requests that omit
  #   max_tokens. nil (absent) = auto (half of profile context window);
  #   0 = never default (send to provider as-is); positive = absolute value.
  # max_label_cardinality: 512   # uncomment to override the default
  #   Bounds how many distinct provider/model labels the metrics registry
  #   tracks. Must be between 16 and 65536.

