# Airouter AI Gateway Configuration
#
# Providers: OpenAI-compatible backend endpoints
# Each provider has:
#   url: The base URL for the OpenAI-compatible API
#   api_key_env: Environment variable name containing the API key
#
# Models: Logical model names (smart, work, fast, large) mapped to fallback chains
# Each chain is a list of endpoints, each specifying:
#   provider: Provider name (key in providers)
#   model: Actual model name on that provider
#
# Distribution rules (see AGENTS.md):
#   - Each chain is ordered best-first by model quality (higher score = smarter),
#     with the strongest model for the profile at the top.
#   - nvidia / nvidia2 / nvidia3 share the same base URL (NVIDIA NIM). The TOP
#     model of every chain is a NVIDIA-NIM model repeated across all three keys
#     (nvidia, nvidia2, nvidia3) so a 429 on one key is absorbed by the next
#     without dropping quality. Every other NVIDIA-NIM model appears exactly once
#     under the `nvidia` key.
#   - The LAST entry of every chain is that profile's "auto" fallback. It is
#     chosen by comparing how many concrete (non-auto) endpoints kilocode vs
#     opencode contributed to the chain:
#         kilocode > opencode (strictly) -> kilocode  `kilo-auto/free`
#         otherwise                      -> opencode  `big-pickle`
#     (In the current free-model list kilocode contributes more in every chain,
#      so all tails are `kilo-auto/free`.)
#
# Models carry their approximate quality score (intelligence benchmark) and
# context window (ctx, in tokens) in the trailing comments for reference.
# Context 0 means "not reported by the source".

providers:
  nvidia:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  nvidia2:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY_2
  nvidia3:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY_3
  ollama:
    url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
  opencode:
    url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
  kilocode:
    url: https://api.kilo.ai/api/gateway/v1
    api_key_env: KILOCODE_API_KEY
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
  gemini2:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_2
  gemini3:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_3
  gemini4:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_4
  gemini5:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_5

