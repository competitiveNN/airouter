# Airouter AI Gateway Configuration
#
# Providers: OpenAI-compatible backend endpoints
# Each provider has:
#   url: The base URL for the OpenAI-compatible API
#   api_key_env: Environment variable name containing the API key
#
# Models: Logical model names (smart, work, fast, large) mapped to fallback chains
# Each chain is a list of endpoints, each specifying:
#   provider: Provider name (key in providers)
#   model: Actual model name on that provider
#
# Distribution rules (see AGENTS.md):
#   - Each chain is ordered best-first by model quality (intelligence benchmark),
#     descending; the strongest model for the profile sits at the top.
#   - Every NVIDIA NIM model is emitted as a consecutive nvidia / nvidia2 / nvidia3
#     trio (same model id, three API keys) so a 429 on one key falls through to the
#     next key on the same model instead of failing the request. No NVIDIA-NIM model
#     ever appears on only one key. Likewise every CommandCode model is emitted as a
#     consecutive commandcode / commandcode2 pair (same model id, two API keys on the
#     shared localhost:3050 proxy) so a rate-limited key falls through to the next.
#     CommandCode models are the four free-tier deals published at
#     https://commandcode.ai/docs/resources/pricing-limits:
#       stealth/space-bunny-alpha, poolside/laguna-s-2.1-free,
#       inclusionai/ling-3.0-flash-sante:free, meituan/longcat-2.0-free
#   - The LAST entry of every chain is that profile's "auto" fallback, chosen by
#     comparing how many concrete (non-auto) endpoints kilocode vs opencode contributed:
#         kilocode_count > opencode_count -> kilocode  `kilo-auto/free`
#         opencode_count > kilocode_count -> opencode  `big-pickle`
#         (ties go to kilocode, per rule 6)
#     Profile-level comparison (concrete kilocode vs opencode endpoints):
#         smart  -> kilocode leads (8 vs 5)    -> kilocode  `kilo-auto/free`
#         work   -> kilocode leads (12 vs 7)   -> kilocode  `kilo-auto/free`
#         fast   -> kilocode leads (4 vs 2)    -> kilocode  `kilo-auto/free`
#         large  -> kilocode leads (15 vs 1)   -> kilocode  `kilo-auto/free`
#     (ties go to kilocode, per rule 6)
#
# Every concrete endpoint carries a `vision:` boolean (true/false) taken from the
# source model's capabilities, driving capability-aware routing (vision requests go
# only to vision-capable models). The trailing auto-fallback meta-router is treated
# as vision-capable (vision: true).
#
# Models carry their approximate quality score (intelligence benchmark) and context
# window (ctx, in tokens) in trailing comments. `elo=` shows the arena.ai code
# leaderboard ELO when present. Context 0 means "not reported by the source".

providers:
  nvidia:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  nvidia2:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY_2
  nvidia3:
    url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY_3
  ollama:
    url: https://ollama.com/v1
    api_key_env: OLLAMA_API_KEY
  opencode:
    url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
  kilocode:
    url: https://api.kilo.ai/api/gateway/v1
    api_key_env: KILOCODE_API_KEY
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
  gemini2:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_2
  gemini3:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_3
  gemini4:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_4
  gemini5:
    url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY_5
  commandcode:
    url: http://127.0.0.1:3050/v1
    api_key_env: COMMANDCODE_API_KEY
  commandcode2:
    url: http://127.0.0.1:3050/v1
    api_key_env: COMMANDCODE_API_KEY_2

preferences:
  # When two models have the same intelligence score, place the newer
  # model (by release date) before the older one in the fallback chain.
  # When false, ties keep their source-provider enumeration order.
  newest_first_on_tie: true

